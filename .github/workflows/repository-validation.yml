name: Repository validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Shell and monitor tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Validate repository scripts
        run: ./scripts/validate-repository.sh

      - name: Test nightly monitor
        run: ./tests/test-nightly-monitor.sh

      - name: Test shared AMD CI lease
        run: ./tests/test-ci-lease.sh

      - name: Test GPU allocation and container policy
        run: python3 -m unittest discover -s tests -p 'test_gpu_lease.py' -v
